[project]
name = "brewblox-history"
version = "1.0.0"
description = "Connector service for Brewblox history data"
readme = "README.md"
authors = [
    {name = "BrewPi", email = "development@brewpi.com"},
]
license = {text = "GPL-3.0"}
requires-python = ">=3.11,<4"
dependencies = [
    "ciso8601>=2.2.0,<3",
    "pytimeparse>=1.1.8,<2",
    "redis>=5.0.0,<6",
    "ujson>=5.8.0,<6",
    "sortedcontainers>=2.4.0,<3",
    "fastapi>=0.109.1,<0.110",
    "uvicorn[standard]>=0.24.0.post1,<0.25",
    "pydantic-settings>=2.1.0,<3",
    "fastapi-mqtt>=2.0.0,<3",
    "httpx>=0.25.2,<0.26",
    "websockets>=12.0,<13",
    "debugpy>=1.8.0,<2",
]

[dependency-groups]
dev = [
    # Test tooling is held at the versions the previous poetry lock resolved;
    # the upgrade is a separate change.
    "pytest>=7.4.3,<8",
    "pytest-cov>=4.1.0,<5",
    "pytest-mock>=3.12.0,<4",
    "pytest-docker>=2.0.1,<3",
    "pytest-asyncio>=0.21.1,<0.22",
    "pytest-httpx>=0.27.0,<0.28",
    "asgi-lifespan>=2.1.0,<3",
    "httpx-ws>=0.4.3,<0.5",
    "invoke>=2.2.0,<3",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = """
    --ignore=victoria/
    --cov=brewblox_history
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-fail-under=100
    --no-cov-on-fail
    --durations=3
    """

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "except asyncio.CancelledError:",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D211",
    "D203",
    "D213",
    "D212",
    "COM812",
    "ISC001",
    "Q000",
    "Q003",
]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "single"

[tool.ruff.lint.extend-per-file-ignores]
"test/**/*.py" = [
    "S101",    # asserts allowed in tests
    "ARG",     # unused function args: fixtures are functionally relevant
    "FBT",     # booleans as positional arguments, e.g. via @pytest.mark.parametrize()
    "PLR2004", # magic value used in comparison
    "S311",    # standard pseudo-random generators are not suitable for cryptographic purposes
    "D103",    # missing docstring in public function
    "ANN201",  # missing return type annotation
    "SLF001",  # private member accessed
]
