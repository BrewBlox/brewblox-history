name: CI build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, edge]
  workflow_dispatch: {}

env:
  DOCKER_IMAGE: ghcr.io/brewblox/brewblox-history

jobs:
  build:
    if: github.repository_owner == 'BrewBlox'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}

      - name: ghcr.io login
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync

      - name: Pull test images
        # The session fixture that runs `docker compose up` must not spend
        # the test run pulling images.
        run: |
          docker compose -f test/docker-compose.yml pull

      - name: Test
        run: |
          uv run pytest

      - name: Lint and type check
        # The locked ruff and pyright: newer ones add rules and checks
        run: |
          uv run ruff format --check --diff
          uv run ruff check
          uv run pyright

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm/v7,linux/arm64/v8
          context: .
