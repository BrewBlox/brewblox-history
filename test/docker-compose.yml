name: brewblox-history-test
services:
  eventbus:
    image: ghcr.io/brewblox/mosquitto:develop
    ports:
      - "1883"
  redis:
    image: redis:7.4
    ports:
      - "6379"
  victoria:
    image: victoriametrics/victoria-metrics:v1.152.0
    command: >-
      --influxMeasurementFieldSeparator=/
      --http.pathPrefix=/victoria
      --dedup.minScrapeInterval=1ms
      --retentionPeriod=100y
    ports:
      - "8428"
  victoria-dense:
    image: victoriametrics/victoria-metrics:v1.152.0
    command: >-
      --influxMeasurementFieldSeparator=/
      --http.pathPrefix=/victoria-dense
      --dedup.minScrapeInterval=1ms
      --retentionPeriod=30d
    ports:
      - "8428"
  victoria-legacy:
    # The single database of release 1, as brewblox-ctl ships it: the migration's source
    image: victoriametrics/victoria-metrics:v1.129.1
    command: >-
      --influxMeasurementFieldSeparator=/
      --http.pathPrefix=/victoria-legacy
      --retentionPeriod=100y
    ports:
      - "8428"
